name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS build and unit tests
    runs-on: macos-26
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select matching command-line tools
        run: sudo xcode-select --switch "$DEVELOPER_DIR"
      - name: Check SDK
        run: xcrun --sdk macosx --show-sdk-version
      - name: Build
        run: ./scripts/quanta build
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install language-server test dependency
        run: npm install --prefix "$RUNNER_TEMP/quanta-language" pyright@1.1.414 --no-audit --no-fund
      - name: Unit tests
        run: TEST_RUNNER_QUANTA_TEST_PYRIGHT="$RUNNER_TEMP/quanta-language/node_modules/.bin/pyright-langserver" ./scripts/quanta test
      - name: Test failure details
        if: failure()
        run: |
          for result in "$HOME"/Library/Developer/Xcode/DerivedData/Quanta-*/Logs/Test/*.xcresult; do
            if [ -d "$result" ]; then
              xcrun xcresulttool get test-results summary --path "$result"
            fi
          done
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-failure-logs
          path: |
            .build/last-*.log
            ~/Library/Developer/Xcode/DerivedData/Quanta-*/Logs/Test/*.xcresult
          include-hidden-files: true
          if-no-files-found: ignore

  python:
    name: Python bridge (${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Standard-library-only bridge
        run: python -S scripts/test-ui-workflows.py
      - name: Install optional scientific packages
        run: python -m pip install numpy pandas matplotlib plotly
      - name: Scientific bridge
        run: python scripts/test-ui-workflows.py
